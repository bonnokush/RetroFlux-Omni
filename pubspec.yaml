name: retroflux_omni
description: "RetroFlux Omni 4.0 PRO - Cross-Platform Universal File Converter"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Architecture
  flutter_riverpod: ^2.5.1

  # Local Persistence & Encrypted App Storage
  shared_preferences: ^2.3.2

  # File & Path Operations
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # Native Image Processing (Zero UI blocking)
  image: ^4.2.0

  # Desktop Window Management
  window_manager: ^0.3.9

  # Desktop Drag and Drop Integration
  desktop_drop: ^0.4.4

  # Encryption & Cryptographic Hashing for Offline Licenses
  crypto: ^3.0.3

  # Formatting & Utilities
  intl: ^0.19.0
  dynamic_color: 1.7.0
  google_fonts: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
  fonts:
    - family: Product Sans
      fonts:
        - asset: assets/fonts/ProductSans-Regular.ttf
        - asset: assets/fonts/ProductSans-Italic.ttf
          style: italic
        - asset: assets/fonts/ProductSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/ProductSans-BoldItalic.ttf
          weight: 700
          style: italic
